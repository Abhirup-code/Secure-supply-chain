# Deployments that each break one rule. Every one must be rejected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-runs-as-root
  namespace: links
  labels:
    app.kubernetes.io/name: links
    owner: abhirup-code
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: links
  template:
    metadata:
      labels:
        app.kubernetes.io/name: links
    spec:
      restartPolicy: Always
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: links
        image: ghcr.io/abhirup-code/secure-supply-chain:v1.0.0
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: DB_PATH
          value: /data/links.db
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        emptyDir:
          sizeLimit: 100Mi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
---
