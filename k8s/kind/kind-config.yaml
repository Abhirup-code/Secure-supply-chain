# Throwaway cluster for the admission tests. containerd reads per-registry settings from
# certs.d, which scripts/admission-test.sh uses to pull from the local test registry.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
