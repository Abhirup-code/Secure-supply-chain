# Default deny for the namespace: only HTTP traffic to the app port is allowed in,
# and nothing is allowed out (the app needs no outbound connections).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: links-allow-http-only
  namespace: links
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
  egress: []
