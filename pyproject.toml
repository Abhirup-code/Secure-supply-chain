[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]   # S = flake8-bandit security rules

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]                 # assert is fine in tests
"fuzz/*" = ["S101", "S104"]          # fuzz checks use assert; "0.0.0.0" is test input, not a bind

[tool.bandit]
exclude_dirs = ["tests"]
