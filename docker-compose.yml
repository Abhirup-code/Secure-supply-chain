services:
  web:
    build: .
    ports:
      - "8000:8000"
    read_only: true            # container filesystem is read-only
    tmpfs: [/tmp]
    volumes:
      - links-data:/data       # the only writable path
    cap_drop: [ALL]            # drop all Linux capabilities
    security_opt:
      - no-new-privileges:true
    environment:
      # SHA-256 hashes of the API keys allowed to create and delete links (see README).
      # Left empty, the app still serves links but refuses all writes.
      API_KEY_HASHES: ${API_KEY_HASHES:-}
    restart: unless-stopped
volumes:
  links-data:
