name: Release

# Push a version tag (for example v1.0.0) on a commit that is already on main to publish a
# signed image for that version and a GitHub Release with the SBOM and verify commands.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tag:
    name: Tag points at a commit on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse tags on commits that never passed review on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  publish:
    name: Publish signed release image
    needs: check-tag
    permissions:
      contents: read
      packages: write     # push to GHCR
      id-token: write     # keyless signing
      attestations: write # build provenance
    # Keep ./ (not $/): the signing certificate then names publish.yml@<branch or tag>,
    # which is the identity the Kubernetes policy trusts.
    uses: ./.github/workflows/publish.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ github.ref_name }}

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - name: Create release with SBOM and verification steps
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          cat > notes.md <<EOF
          ## Image

          \`${IMAGE}:${TAG}\`

          Digest: \`${DIGEST}\`

          Signed with Sigstore (keyless) by this repository's publish workflow, with a signed
          SPDX SBOM and SLSA build provenance attached. The SBOM is also attached to this release.

          ## Verify it yourself

          \`\`\`bash
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp '^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/publish\.yml@' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

          gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}
          \`\`\`

          EOF
          gh release create "$TAG" sbom.spdx.json \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes-file notes.md --generate-notes --verify-tag
