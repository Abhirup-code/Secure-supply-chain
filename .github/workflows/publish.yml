name: Publish

# Reusable workflow: build and push the image, sign it, attach signed SBOM and build
# provenance, then verify everything the same way a cluster would before trusting it.
# Called by CI (pushes to main) and Release (version tags). The Kubernetes policy trusts
# exactly this workflow file as the signer.

on:
  workflow_call:
    inputs:
      version:
        description: Release version tag (for example v1.0.0). Empty for main builds.
        type: string
        default: ""
    outputs:
      image:
        description: Image name without a tag
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: Digest of the published, signed image
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish, sign, attest, and verify image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write     # push to GHCR
      id-token: write     # keyless signing with Sigstore (no long-lived keys)
      attestations: write # store the build provenance attestation
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ inputs.version }}
      SIGNER: ^https://github\.com/Abhirup-code/Secure-supply-chain/\.github/workflows/publish\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4 # the version the policies are tested against
      - name: Install syft and kyverno (checksum verified)
        run: |
          scripts/install-tools.sh syft kyverno
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Set image name and tags
        id: name
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          if [ -n "$VERSION" ]; then
            printf 'TAGS<<EOF\n%s:%s\n%s:%s\nEOF\n' "$image" "$VERSION" "$image" "$GITHUB_SHA" >> "$GITHUB_ENV"
          else
            printf 'TAGS<<EOF\n%s:latest\n%s:%s\nEOF\n' "$image" "$image" "$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # The SBOM and provenance are attached below as signed attestations instead.
          provenance: false
          sbom: false
          tags: ${{ env.TAGS }}

      - name: Sign image by digest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM and attach it as a signed attestation
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          syft -q "registry:${IMAGE}@${DIGEST}" -o spdx-json=sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

      - name: Attach signed SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify signature, SBOM, and provenance
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "$SIGNER" --certificate-oidc-issuer "$ISSUER" > /dev/null
          echo "signature verified"
          cosign verify-attestation --type spdxjson "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "$SIGNER" --certificate-oidc-issuer "$ISSUER" > /dev/null
          echo "SBOM attestation verified"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/publish.yml"
          echo "build provenance verified"

      - name: Prove the production cluster policy admits this exact image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          IMAGE_REF="${IMAGE}@${DIGEST}" yq '.spec.template.spec.containers[0].image = strenv(IMAGE_REF)' \
            k8s/app/deployment.yaml > deployment-under-test.yaml
          # List the policy files: given the folder, the CLI also reads the tests and loads nothing.
          kyverno apply k8s/policies/require-signed-images.yaml \
            k8s/policies/restrict-image-registries.yaml k8s/policies/require-hardened-pods.yaml \
            --resource deployment-under-test.yaml --registry \
            > policy-result.txt 2>&1 || true
          cat policy-result.txt
          # The Kyverno CLI exits 0 even when a check fails, so read its summary line instead.
          grep -Eq 'fail: 0, warn: 0, error: 0' policy-result.txt || {
            echo "::error::the production policies would reject this image"; exit 1; }
          grep -Eq 'pass: 3,' policy-result.txt || {
            echo "::error::the policies did not evaluate this image"; exit 1; }

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Published image"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "- Signed (keyless, Sigstore) and verified"
            echo "- Signed SBOM (SPDX) and SLSA build provenance attached and verified"
            echo "- Production Kyverno policies admit this exact digest"
          } >> "$GITHUB_STEP_SUMMARY"
