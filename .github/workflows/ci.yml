name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only unless a job asks for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a publish that is already under way on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: Lint, test, and SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Lint (ruff, includes security rules)
        run: ruff check . && ruff format --check .
      - name: SAST (bandit)
        run: bandit -c pyproject.toml -r app
      - name: Tests with coverage gate
        run: pytest -v --cov=app --cov-fail-under=90

  image:
    name: Build, smoke test, and scan image
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload scan results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke test
        run: |
          docker build -t secure-supply-chain:test .
          # A throwaway API key for this run only; the container gets just its hash.
          API_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::${API_KEY}"
          API_KEY_HASHES="$(printf '%s' "$API_KEY" | sha256sum | cut -d' ' -f1)"
          docker run -d --name smoke -p 8000:8000 --read-only --tmpfs /tmp \
            -e API_KEY_HASHES="$API_KEY_HASHES" \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v ship-data:/data secure-supply-chain:test
          for _ in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/health
          # Save the response and read it with jq (no piping downloaded content into an interpreter)
          # Without a key, creating a link is refused
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com"}' http://localhost:8000/api/links)" = "401"
          curl -sf -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer ${API_KEY}" \
            -d '{"url":"https://example.com"}' -o created.json http://localhost:8000/api/links
          code=$(jq -r .code created.json)
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000/${code}")" = "302"
          test "$(docker exec smoke id -u)" != "0"
          docker rm -f smoke
      - name: Generate SBOM and scan it with Grype (second scanner)
        run: |
          scripts/install-tools.sh syft grype
          bin/syft -q docker:secure-supply-chain:test -o spdx-json=sbom.spdx.json
          bin/grype sbom:sbom.spdx.json --config .grype.yaml
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-pr-build
          path: sbom.spdx.json
      - name: Scan Dockerfile and config for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          # Deliberately insecure examples that the policy tests must reject
          skip-dirs: k8s/policies/tests
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Scan image (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: secure-supply-chain:test
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          skip-setup-trivy: true
      - name: Upload image scan to Security tab
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Fail on fixable CRITICAL or HIGH image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: secure-supply-chain:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  policy:
    name: Kubernetes manifests and policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kube-linter and kyverno (checksum verified)
        run: scripts/install-tools.sh kube-linter kyverno
      - name: Lint manifests (kube-linter, all built-in checks)
        run: bin/kube-linter lint --config .kube-linter.yaml k8s/app
      - name: Test pod and registry policies (good and bad examples)
        run: bin/kyverno test k8s/policies/tests

  fuzz:
    name: Fuzz the link API (Atheris)
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements-fuzz.txt
      - name: Fuzz for 5 minutes (fails on any crash or broken security rule)
        run: |
          mkdir -p fuzz-findings
          PYTHONPATH=. python fuzz/fuzz_links.py -max_total_time=300 -artifact_prefix=fuzz-findings/
      - name: Upload the input that broke a rule
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: fuzz-findings/

  dast:
    name: DAST (OWASP ZAP API scan)
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start the hardened container
        run: |
          docker build -t secure-supply-chain:dast .
          # Give ZAP a valid API key so it can test the protected endpoints too.
          API_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::${API_KEY}"
          echo "ZAP_AUTH_HEADER_VALUE=Bearer ${API_KEY}" >> "$GITHUB_ENV"
          API_KEY_HASHES="$(printf '%s' "$API_KEY" | sha256sum | cut -d' ' -f1)"
          # Rate limit raised so the scanner tests the app, not the limiter.
          docker run -d --name app -p 8000:8000 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e RATE_LIMIT_PER_MINUTE=1000000 -e API_KEY_HASHES="$API_KEY_HASHES" \
            -v dast-data:/data secure-supply-chain:dast
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 1
          done
      - name: Scan the running API with ZAP (fails on injection, XSS, traversal findings)
        run: |
          mkdir -p zap
          cp docs/openapi.yaml .zap/rules.tsv zap/
          chmod -R a+rwX zap
          docker run --rm --network host -e ZAP_AUTH_HEADER_VALUE -e ZAP_AUTH_HEADER_SITE=localhost \
            -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t openapi.yaml -f openapi -O http://localhost:8000 \
            -c rules.tsv -I -r zap-report.html -J zap-report.json
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: zap/zap-report.*
      - name: Container logs
        if: failure()
        run: docker logs app

  admission:
    name: Admission control in a real cluster (kind + Kyverno)
    needs: [lint-test, policy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4 # the version the policies are tested against
      - name: Install syft (checksum verified)
        run: |
          scripts/install-tools.sh syft
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Create a throwaway Kubernetes cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: admission
          config: k8s/kind/kind-config.yaml
      - name: Prove signed images run and everything else is refused
        run: scripts/admission-test.sh
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n kyverno logs deploy/kyverno-admission-controller --tail=200 || true

  publish:
    name: Publish (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image, policy, fuzz, dast, admission]
    permissions:
      contents: read
      packages: write     # push to GHCR
      id-token: write     # keyless signing
      attestations: write # build provenance
    # Keep ./ (not $/): the signing certificate then names publish.yml@<branch or tag>,
    # which is the identity the Kubernetes policy trusts.
    uses: ./.github/workflows/publish.yml # zizmor: ignore[self-repository]
