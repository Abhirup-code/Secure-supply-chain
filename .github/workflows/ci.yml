name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only unless a job asks for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint, test, and SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Lint (ruff, includes security rules)
        run: ruff check . && ruff format --check .
      - name: SAST (bandit)
        run: bandit -c pyproject.toml -r app
      - name: Tests with coverage gate
        run: pytest -v --cov=app --cov-fail-under=90

  image:
    name: Build, smoke test, and scan image
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload scan results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke test
        run: |
          docker build -t secure-supply-chain:test .
          docker run -d --name smoke -p 8000:8000 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v ship-data:/data secure-supply-chain:test
          for i in $(seq 1 20); do curl -sf http://localhost:8000/health && break || sleep 1; done
          curl -sf http://localhost:8000/health
          code=$(curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com"}' http://localhost:8000/api/links | python3 -c 'import sys,json;print(json.load(sys.stdin)["code"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/$code)" = "302"
          test "$(docker exec smoke id -u)" != "0"
          docker rm -f smoke
      - name: Scan Dockerfile and config for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Scan image (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: secure-supply-chain:test
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          skip-setup-trivy: true
      - name: Upload image scan to Security tab
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Fail on fixable CRITICAL or HIGH image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: secure-supply-chain:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  publish:
    name: Publish, sign, and verify image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless signing with Sigstore (no long-lived keys)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push with SBOM and provenance
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Sign image by digest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
